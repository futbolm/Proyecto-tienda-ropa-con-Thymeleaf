<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Boletas - MAISON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --dark:   #16140f;
      --cream:  #f5f0e8;
      --cream2: #ede6d8;
      --sand:   #c9b89a;
      --accent: #b5956a;
      --warm:   #8c7b6b;
      --border: rgba(201,184,154,0.2);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; color: var(--dark); }

    /* NAVBAR */
    .navbar-maison {
      background: var(--dark); padding: 0 32px; height: 64px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 900; border-bottom: 1px solid var(--border);
    }
    .navbar-brand-txt { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; color: var(--cream); letter-spacing: 0.12em; }
    .navbar-brand-txt em { font-style: italic; color: var(--sand); }
    .navbar-right { display: flex; align-items: center; gap: 10px; }
    .btn-nav {
      background: transparent; border: 1px solid var(--border); color: var(--sand);
      font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 2px; text-decoration: none;
      font-family: 'Jost', sans-serif; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-nav:hover { background: rgba(181,149,106,0.15); color: var(--cream); border-color: var(--accent); text-decoration: none; }

    /* PAGE */
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 40px 28px; }
    .page-hero { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--cream2); }
    .page-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; margin-bottom: 4px; }
    .page-hero h1 em { font-style: italic; color: var(--accent); }
    .page-hero p { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm); margin: 0; }

    /* TABLE CARD */
    .table-card { background: white; border: 1px solid var(--cream2); border-radius: 4px; overflow: hidden; }
    .table-card-header {
      padding: 14px 22px; border-bottom: 1px solid var(--cream2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-card-title { font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); display: flex; align-items: center; gap: 8px; }
    .table-card-title i { color: var(--accent); }

    .maison-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .maison-table thead th {
      padding: 11px 20px; font-size: 0.58rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--warm);
      border-bottom: 1px solid var(--cream2); font-weight: 400; background: #faf7f2;
    }
    .maison-table tbody tr { border-bottom: 1px solid #f2ede4; transition: background 0.15s; }
    .maison-table tbody tr:last-child { border-bottom: none; }
    .maison-table tbody tr:hover { background: #faf7f2; }
    .maison-table td { padding: 14px 20px; vertical-align: middle; }

    .num-bol { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--dark); }
    .fecha-val { font-size: 0.78rem; color: var(--warm); }
    .total-val { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--dark); }

    .btn-ver {
      background: var(--dark); color: var(--cream); border: none;
      font-family: 'Jost', sans-serif; font-size: 0.58rem; letter-spacing: 0.25em;
      text-transform: uppercase; padding: 7px 14px; border-radius: 2px;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.2s;
    }
    .btn-ver:hover { background: var(--accent); color: var(--cream); text-decoration: none; }

    .empty-state { padding: 60px 20px; text-align: center; color: var(--warm); }
    .empty-state i { font-size: 2rem; opacity: 0.25; display: block; margin-bottom: 12px; }
    .empty-state p { font-size: 0.78rem; letter-spacing: 0.08em; }
    .empty-state a { color: var(--accent); text-decoration: none; }
    .empty-state a:hover { text-decoration: underline; }

    @media (max-width: 576px) { .page-wrap { padding: 24px 16px; } .navbar-maison { padding: 0 16px; } }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar-maison">
  <div class="navbar-brand-txt">MAI<em>SON</em></div>
  <div class="navbar-right">
    <a href="/tienda/inicio" class="btn-nav"><i class="fa-solid fa-store"></i> Tienda</a>
    <a href="/logout" class="btn-nav"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-wrap">

  <div class="page-hero">
    <h1>Mis <em>Boletas</em></h1>
    <p>Historial de tus compras · MAISON</p>
  </div>

  <div class="table-card">
    <div class="table-card-header">
      <div class="table-card-title"><i class="fa-solid fa-receipt"></i> Historial de compras</div>
      <span style="font-size:0.65rem; color:var(--warm);"
            th:if="${lstBoletas != null and !#lists.isEmpty(lstBoletas)}"
            th:text="${#lists.size(lstBoletas)} + ' compra(s)'"></span>
    </div>

    <!-- Vacío -->
    <div th:if="${lstBoletas == null or #lists.isEmpty(lstBoletas)}" class="empty-state">
      <i class="fa-solid fa-receipt"></i>
      <p>Aún no tienes boletas registradas.<br>
        <a href="/tienda/inicio">Visita la tienda</a> para hacer tu primera compra.</p>
    </div>

    <!-- Con boletas -->
    <table th:if="${lstBoletas != null and !#lists.isEmpty(lstBoletas)}" class="maison-table">
      <thead>
        <tr>
          <th># Boleta</th>
          <th>Fecha</th>
          <th class="text-right">Total</th>
          <th class="text-center">Detalle</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="b : ${lstBoletas}">
          <td><span class="num-bol"># <span th:text="${b.numBol}"></span></span></td>
          <td><span class="fecha-val" th:text="${b.fecha}"></span></td>
          <td class="text-right">
            <span class="total-val">S/ <span th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></span></span>
          </td>
          <td class="text-center">
            <a th:href="@{'/tienda/mi-boleta/' + ${b.numBol}}" class="btn-ver">
              <i class="fa-solid fa-eye"></i> Ver
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
