<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle Boleta - MAISON Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --dark:#16140f; --cream:#f5f0e8; --cream2:#ede6d8; --sand:#c9b89a; --accent:#b5956a; --warm:#8c7b6b; --border:rgba(201,184,154,0.2); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; color: var(--dark); }

    .navbar-maison { background: var(--dark); padding: 0 32px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 900; border-bottom: 1px solid var(--border); }
    .navbar-brand-txt { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; color: var(--cream); letter-spacing: 0.12em; }
    .navbar-brand-txt em { font-style: italic; color: var(--sand); }
    .navbar-right { display: flex; align-items: center; gap: 10px; }
    .btn-nav { background: transparent; border: 1px solid var(--border); color: var(--sand); font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 6px 14px; border-radius: 2px; text-decoration: none; font-family: 'Jost', sans-serif; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-nav:hover { background: rgba(181,149,106,0.15); color: var(--cream); border-color: var(--accent); text-decoration: none; }

    .page-wrap { max-width: 860px; margin: 0 auto; padding: 40px 28px; }

    /* BOLETA HEADER */
    .boleta-header { background: var(--dark); border-radius: 4px; padding: 26px 30px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .boleta-num { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; color: var(--cream); }
    .boleta-num small { font-family: 'Jost', sans-serif; font-size: 0.58rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm); display: block; margin-bottom: 4px; }
    .boleta-meta { display: flex; gap: 28px; flex-wrap: wrap; }
    .meta-label { font-size: 0.58rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--warm); margin-bottom: 4px; }
    .meta-value { font-size: 0.82rem; color: var(--sand); }
    .meta-value.big { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; }

    /* INFO CARDS */
    .info-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .info-card { background: white; border: 1px solid var(--cream2); border-radius: 4px; padding: 20px 24px; flex: 1; min-width: 200px; }
    .info-card-label { font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .info-card-label i { color: var(--accent); }
    .info-card-value { font-size: 0.88rem; color: var(--dark); }
    .info-card-sub { font-size: 0.72rem; color: var(--warm); margin-top: 3px; }

    /* TABLE */
    .section-card { background: white; border: 1px solid var(--cream2); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .section-header { padding: 13px 20px; border-bottom: 1px solid var(--cream2); font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); display: flex; align-items: center; gap: 8px; }
    .section-header i { color: var(--accent); }

    .maison-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .maison-table thead th { padding: 10px 18px; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); border-bottom: 1px solid var(--cream2); font-weight: 400; background: #faf7f2; }
    .maison-table tbody tr { border-bottom: 1px solid #f2ede4; transition: background 0.15s; }
    .maison-table tbody tr:last-child { border-bottom: none; }
    .maison-table tbody tr:hover { background: #faf7f2; }
    .maison-table td { padding: 13px 18px; vertical-align: middle; }
    .maison-table tfoot td { padding: 16px 18px; border-top: 2px solid var(--cream2); }

    .prod-img-mini { width: 46px; height: 46px; border-radius: 2px; object-fit: cover; }
    .prod-img-placeholder { width: 46px; height: 46px; border-radius: 2px; background: var(--cream2); display: flex; align-items: center; justify-content: center; color: var(--sand); font-size: 0.8rem; }
    .prod-name { font-weight: 400; color: var(--dark); }
    .prod-code { font-size: 0.65rem; color: var(--warm); margin-top: 2px; }
    .qty-badge { background: rgba(181,149,106,0.12); color: var(--accent); padding: 3px 10px; border-radius: 2px; font-size: 0.72rem; }
    .price-val { font-family: 'Cormorant Garamond', serif; font-size: 1rem; }
    .subtotal-val { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
    .total-final { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: var(--accent); }

    .btn-back { background: transparent; border: 1px solid var(--cream2); color: var(--warm); font-family: 'Jost', sans-serif; font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 8px 16px; border-radius: 2px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<nav class="navbar-maison">
  <div class="navbar-brand-txt">MAI<em>SON</em></div>
  <div class="navbar-right">
	<a href="/tienda/mis-boletas" class="btn-back">
	  <i class="fa-solid fa-arrow-left"></i> Mis Boletas
	</a>
    <a href="/logout" class="btn-nav"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
  </div>
</nav>

<div class="page-wrap">

  <!-- BOLETA HEADER -->
  <div class="boleta-header">
    <div class="boleta-num">
      <small>Número de boleta</small>
      # <span th:text="${boleta.numBol}"></span>
    </div>
    <div class="boleta-meta">
      <div>
        <div class="meta-label">Fecha</div>
        <div class="meta-value" th:text="${boleta.fecha}"></div>
      </div>
      <div>
        <div class="meta-label">Items</div>
        <div class="meta-value" th:text="${#lists.size(boleta.detalle)} + ' producto(s)'"></div>
      </div>
      <div>
        <div class="meta-label">Total</div>
        <div class="meta-value big">
          S/ <span th:text="${#numbers.formatDecimal(boleta.total, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- CLIENTE -->
  <div class="info-row">
    <div class="info-card">
      <div class="info-card-label"><i class="fa-solid fa-user"></i> Cliente</div>
      <div class="info-card-value" th:text="${boleta.objUsuario?.nomUsua + ' ' + boleta.objUsuario?.apeUsua}">—</div>
      <div class="info-card-sub" th:text="${boleta.objUsuario?.email}">—</div>
    </div>
    <div class="info-card">
      <div class="info-card-label"><i class="fa-solid fa-phone"></i> Contacto</div>
      <div class="info-card-value" th:text="${boleta.objUsuario?.telefono}">—</div>
      <div class="info-card-sub">DNI: <span th:text="${boleta.objUsuario?.dni}">—</span></div>
    </div>
  </div>

  <!-- PRODUCTOS -->
  <div class="section-card">
    <div class="section-header"><i class="fa-solid fa-shirt"></i> Productos comprados</div>
    <table class="maison-table">
      <thead>
        <tr>
          <th colspan="2">Producto</th>
          <th class="text-center">Talla / Color</th>
          <th class="text-center">Cant.</th>
          <th class="text-right">Precio Unit.</th>
          <th class="text-right">Subtotal</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="det : ${boleta.detalle}">
          <td style="width:58px; padding-right:0;">
            <img th:if="${det.objProducto?.imagen != null}"
                 th:src="@{'/img/productos/' + ${det.objProducto.imagen}}"
                 class="prod-img-mini"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <!-- 
				 <div class="prod-img-placeholder">
              <i class="fa-regular fa-image"></i>
            </div>
			-->
          </td>
          <td>
            <div class="prod-name" th:text="${det.objProducto != null ? det.objProducto.desProd : det.idProd}"></div>
            <div class="prod-code" th:text="${det.idProd}"></div>
          </td>
          <td class="text-center">
            <span th:if="${det.objProducto != null}" style="font-size:0.75rem; color:var(--warm);"
                  th:text="${det.objProducto.talla + ' · ' + det.objProducto.color}"></span>
            <span th:if="${det.objProducto == null}">—</span>
          </td>
          <td class="text-center">
            <span class="qty-badge" th:text="${det.cantidad}"></span>
          </td>
          <td class="text-right">
            <span class="price-val">S/ <span th:text="${#numbers.formatDecimal(det.precio, 1, 'COMMA', 2, 'POINT')}"></span></span>
          </td>
          <td class="text-right">
            <span class="subtotal-val">S/ <span th:text="${#numbers.formatDecimal(det.cantidad * det.precio, 1, 'COMMA', 2, 'POINT')}"></span></span>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="5" style="text-align:right; font-size:0.6rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--warm);">
            Total de la boleta
          </td>
          <td class="text-right">
            <span class="total-final">S/ <span th:text="${#numbers.formatDecimal(boleta.total, 1, 'COMMA', 2, 'POINT')}"></span></span>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- ACCIONES -->
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
	
    <!-- 
		<a th:href="@{'/boletas/cliente/' + ${boleta.objUsuario?.codUsua}}" class="btn-back">
		      <i class="fa-solid fa-arrow-left"></i> Volver al cliente
		    </a>
		    <a href="/boletas/listar" class="btn-back">
		      <i class="fa-solid fa-users"></i> Todos los clientes
		</a>
	-->
	
	<!-- agregamos esto para imprimir boletas -->
	   <a th:href="@{'/boletas/imprimir/' + ${boleta.numBol}}" 
	      class="btn-back" 
	      target="_blank"
	      style="border-color:var(--accent); color:var(--accent);">
	       <i class="fa-solid fa-file-pdf"></i> Descargar Boleta
	   </a>
  </div>

</div>
</body>
</html>
