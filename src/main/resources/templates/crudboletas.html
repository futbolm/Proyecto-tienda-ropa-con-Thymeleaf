<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boletas - MAISON Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --dark:#16140f; --cream:#f5f0e8; --cream2:#ede6d8; --sand:#c9b89a; --accent:#b5956a; --warm:#8c7b6b; --border:rgba(201,184,154,0.2); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; color: var(--dark); }

    .navbar-maison { background: var(--dark); padding: 0 32px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 900; border-bottom: 1px solid var(--border); }
    .navbar-brand-txt { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; color: var(--cream); letter-spacing: 0.12em; }
    .navbar-brand-txt em { font-style: italic; color: var(--sand); }
    .navbar-right { display: flex; align-items: center; gap: 10px; }
    .btn-nav { background: transparent; border: 1px solid var(--border); color: var(--sand); font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 6px 14px; border-radius: 2px; text-decoration: none; font-family: 'Jost', sans-serif; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-nav:hover { background: rgba(181,149,106,0.15); color: var(--cream); border-color: var(--accent); text-decoration: none; }

    .page-wrap { max-width: 1000px; margin: 0 auto; padding: 40px 28px; }
    .page-hero { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--cream2); }
    .page-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; margin-bottom: 4px; }
    .page-hero h1 em { font-style: italic; color: var(--accent); }
    .page-hero p { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm); margin: 0; }

    .stats-row { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat-card { background: white; border: 1px solid var(--cream2); border-radius: 4px; padding: 18px 22px; flex: 1; min-width: 140px; }
    .stat-label { font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); margin-bottom: 6px; }
    .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: var(--dark); }
    .stat-value.accent { color: var(--accent); }

    .table-card { background: white; border: 1px solid var(--cream2); border-radius: 4px; overflow: hidden; }
    .table-card-header { padding: 14px 20px; border-bottom: 1px solid var(--cream2); display: flex; align-items: center; gap: 8px; font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); }
    .table-card-header i { color: var(--accent); }

    .maison-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .maison-table thead th { padding: 10px 18px; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); border-bottom: 1px solid var(--cream2); font-weight: 400; background: #faf7f2; }
    .maison-table tbody tr { border-bottom: 1px solid #f2ede4; transition: background 0.15s; }
    .maison-table tbody tr:last-child { border-bottom: none; }
    .maison-table tbody tr:hover { background: #faf7f2; }
    .maison-table td { padding: 13px 18px; vertical-align: middle; }

    .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(181,149,106,0.12); display: inline-flex; align-items: center; justify-content: center; font-size: 0.72rem; color: var(--accent); flex-shrink: 0; }
    .client-name { font-weight: 400; color: var(--dark); }
    .client-sub { font-size: 0.68rem; color: var(--warm); }
    .badge-boleta { background: rgba(181,149,106,0.12); color: var(--accent); font-size: 0.65rem; padding: 3px 10px; border-radius: 2px; }
    .total-val { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--dark); }
    .btn-ver { background: var(--dark); color: var(--cream); border: none; font-family: 'Jost', sans-serif; font-size: 0.58rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 6px 14px; border-radius: 2px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn-ver:hover { background: var(--accent); color: var(--cream); text-decoration: none; }
    .empty-state { padding: 50px 20px; text-align: center; color: var(--warm); }
    .empty-state i { font-size: 1.8rem; opacity: 0.25; display: block; margin-bottom: 10px; }
    .empty-state p { font-size: 0.78rem; }
  </style>
</head>
<body>

<nav class="navbar-maison">
  <div class="navbar-brand-txt">MAI<em>SON</em></div>
  <div class="navbar-right">
	
    <span style="font-size:0.72rem; color:var(--warm);">
      <i class="fa-regular fa-user" style="color:var(--sand); margin-right:5px;"></i>
      <span class="user-name" th:text="${session.usuarioSession?.nomUsua + ' ' + session.usuarioSession?.apeUsua}">Administrador</span>
    </span>
    <a href="/logout" class="btn-nav"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
  </div>
</nav>

<div class="page-wrap">

  <div class="page-hero">
    <h1>Boletas por <em>Cliente</em></h1>
    <p>Resumen de ventas agrupadas por cliente</p>
  </div>
  
  

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Clientes</div>
      <div class="stat-value" th:text="${#maps.size(boletasPorCliente)}">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Boletas</div>
      <div class="stat-value accent"
           th:text="${totalBoletas}">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Recaudado Total</div>
      <div class="stat-value accent">
        S/ <span th:text="${#numbers.formatDecimal(
          totalesPorCliente.values(),
          1, 'COMMA', 2, 'POINT')}">0.00</span>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-card-header">
      <i class="fa-solid fa-table"></i> Clientes con Compras
    </div>
    <table class="maison-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th class="text-center">N° Boletas</th>
          <th class="text-center">Total Gastado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#maps.isEmpty(boletasPorCliente)}">
          <td colspan="4">
            <div class="empty-state">
              <i class="fa-solid fa-receipt"></i>
              <p>No hay boletas registradas.</p>
            </div>
          </td>
        </tr>
        <tr th:each="entry : ${boletasPorCliente}">
          <td>
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="avatar"
                   th:text="${#strings.substring(entry.key.nomUsua,0,1) + #strings.substring(entry.key.apeUsua,0,1)}"></div>
              <div>
                <div class="client-name" th:text="${entry.key.nomUsua + ' ' + entry.key.apeUsua}"></div>
                <div class="client-sub" th:text="${entry.key.email}"></div>
              </div>
            </div>
          </td>
          <td class="text-center">
            <span class="badge-boleta" th:text="${#lists.size(entry.value)} + ' boleta(s)'"></span>
          </td>
          <td class="text-center">
            <span class="total-val">
              S/ <span th:text="${#numbers.formatDecimal(totalesPorCliente[entry.key.codUsua], 1, 'COMMA', 2, 'POINT')}"></span>
            </span>
          </td>
          <td class="text-center">
            <a th:href="@{'/boletas/cliente/' + ${entry.key.codUsua}}" class="btn-ver">
              <i class="fa-solid fa-eye"></i> Ver Historial
            </a>
          </td>
        </tr>
      </tbody>
    </table>
	
  </div>
  
  <!-- ACCIONES -->
  <div style="margin-top:20px;">
    <a href="/dashboard" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Volver a Clientes
    </a>
  </div>
  
<style>
	
	.btn-back { 
	  background: transparent; 
	  border: 1px solid var(--cream2); 
	  color: var(--warm); 
	  font-family: 'Jost', sans-serif; 
	  font-size: 0.6rem; 
	  letter-spacing: 0.25em; 
	  text-transform: uppercase; 
	  padding: 8px 16px; 
	  border-radius: 2px; 
	  text-decoration: none; 
	  display: inline-flex; 
	  align-items: center; 
	  gap: 6px; 
	  transition: all 0.2s; 
	}
	.btn-back:hover { 
	  border-color: var(--accent); 
	  color: var(--accent); 
	  text-decoration: none; 
	}
</style>
  

</div>
</body>
</html>
