<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos - MAISON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --dark:   #16140f;
      --cream:  #f5f0e8;
      --cream2: #ede6d8;
      --sand:   #c9b89a;
      --accent: #b5956a;
      --warm:   #8c7b6b;
      --error:  #c0392b;
      --border: rgba(201,184,154,0.2);
    }
    html, body { margin: 0; padding: 0; background: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; color: var(--dark); }

    .page-body { padding: 40px 32px; max-width: 1400px; margin: 0 auto; }

    /* HEADER */
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--cream2); }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 300; color: var(--dark); line-height: 1.1; }
    .page-title em { font-style: italic; color: var(--accent); }
    .page-sub { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--warm); margin-top: 4px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    /* BUTTONS */
    .btn-primary-custom { background: var(--dark); color: var(--cream); border: none; font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; text-decoration: none; transition: background 0.25s, letter-spacing 0.25s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer; }
    .btn-primary-custom:hover { background: var(--accent); color: var(--cream); letter-spacing: 0.45em; text-decoration: none; }
    .btn-back { background: transparent; color: var(--warm); border: 1px solid var(--cream2); font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .btn-back:hover { border-color: var(--warm); color: var(--dark); text-decoration: none; }

    /* TABLE CARD */
    .table-card { background: white; border-radius: 4px; border: 1px solid var(--cream2); overflow: hidden; animation: fadeUp 0.5s ease both; }
    .table-card-header { padding: 16px 24px; border-bottom: 1px solid var(--cream2); display: flex; align-items: center; justify-content: space-between; }
    .table-card-header .t-title { font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm); display: flex; align-items: center; gap: 8px; }
    .table-card-header .t-title i { color: var(--accent); }

    .table-maison { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .table-maison thead tr { border-bottom: 1px solid var(--cream2); }
    .table-maison thead th { padding: 12px 16px; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); font-weight: 400; background: #faf7f2; }
    .table-maison tbody tr { border-bottom: 1px solid #f2ede4; transition: background 0.15s; }
    .table-maison tbody tr:last-child { border-bottom: none; }
    .table-maison tbody tr:hover { background: #fdf9f4; }
    .table-maison tbody td { padding: 12px 16px; color: var(--dark); vertical-align: middle; font-weight: 300; }

    .prod-img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
    .img-placeholder { width: 44px; height: 44px; background: var(--cream2); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--sand); font-size: 0.9rem; }

    .badge-stock { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.68rem; letter-spacing: 0.05em; font-weight: 400; }
    .badge-ok    { background: #edf7f1; color: #2d6a4f; }
    .badge-low   { background: #fff4e6; color: #c0712a; }
    .badge-empty { background: #fef0f0; color: #c0392b; }

    .badge-estado { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; letter-spacing: 0.06em; font-weight: 400; }
    .badge-activo   { background: #edf7f1; color: #2d6a4f; }
    .badge-inactivo { background: #fef0f0; color: #c0392b; }

    .btn-action { width: 30px; height: 30px; border-radius: 3px; border: 1px solid var(--cream2); background: white; color: var(--warm); font-size: 0.72rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); background: rgba(181,149,106,0.06); text-decoration: none; }
    .btn-action.danger:hover { border-color: #c0392b; color: #c0392b; background: rgba(192,57,43,0.05); }
    .btn-action.success-btn:hover { border-color: #2d6a4f; color: #2d6a4f; background: rgba(45,106,79,0.05); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--warm); }
    .empty-state i { font-size: 2rem; opacity: 0.3; margin-bottom: 16px; display: block; color: var(--sand); }
    .empty-state p { font-size: 0.8rem; letter-spacing: 0.1em; opacity: 0.7; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      .page-body { padding: 24px 16px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 14px; }
      .header-actions { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>

<div class="page-body">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <div class="page-title">Gestión de <em>Productos</em></div>
      <div class="page-sub">Catálogo &nbsp;·&nbsp; MAISON</div>
    </div>
    <div class="header-actions">
      <a href="/Productos/nuevo" class="btn-primary-custom">
        <i class="fa-solid fa-plus"></i> Nuevo Producto
      </a>
      <a href="/dashboard" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Volver
      </a>
    </div>
  </div>

  <!-- TABLE CARD -->
  <div class="table-card">
    <div class="table-card-header">
      <div class="t-title">
        <i class="fa-solid fa-shirt"></i> Productos Registrados
      </div>
      <a href="/Productos/nuevo" class="btn-primary-custom" style="padding:7px 16px;">
        <i class="fa-solid fa-plus"></i> Agregar
      </a>
    </div>

    <!-- CON DATOS -->
    <div th:if="${lstProductos != null and !lstProductos.isEmpty()}" class="table-responsive">
      <table class="table-maison">
        <thead>
          <tr>
            <th>Código</th>
            <th>Imagen</th>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Talla</th>
            <th>Stock</th>
            <th>Precio</th>
            <th>Estado</th>
			<th>Fecha Registro</th>
			<th>Fecha Actualizacion</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${lstProductos}">

            <!-- Código -->
            <td style="color:var(--warm); font-size:0.78rem;" th:text="${p.idProd}"></td>

            <!-- Imagen -->
            <td>
              <img 
                   th:src="@{'/img/productos/' + ${p.imagen != null ? p.imagen : 'default.jpg'}}"
                   onerror="this.src='/img/productos/default.jpg'"
				   width="60" height="60" style="object-fit:cover; border-radius:6px;"
                   class="prod-img">
              <div class="img-placeholder" th:style="${p.imagen != null} ? 'display:none' : ''">
                <i class="fa-regular fa-image"></i>
              </div>
            </td>
			

            <!-- Nombre + Proveedor -->
            <td>
              <div style="font-weight:400;" th:text="${p.desProd}"></div>
              <div style="font-size:0.7rem; color:var(--warm);"
                   th:text="${p.objProveedor?.nombre}"></div>
            </td>

            <!-- Categoría -->
            <td style="color:var(--warm); font-size:0.78rem;"
                th:text="${p.objCategoria?.descripcion}"></td>

            <!-- Talla -->
            <td style="color:var(--warm); font-size:0.78rem;"
                th:text="${p.talla}"></td>

            <!-- Stock badge -->
            <td>
              <span class="badge-stock"
                    th:classappend="${p.stkProd > 10} ? 'badge-ok' : (${p.stkProd > 0} ? 'badge-low' : 'badge-empty')"
                    th:text="${p.stkProd}">0</span>
            </td>

            <!-- Precio -->
            <td style="font-family:'Cormorant Garamond',serif; font-size:1.05rem;"
                th:text="${'S/ ' + #numbers.formatDecimal(p.preProd, 1, 'COMMA', 2, 'POINT')}"></td>

            <!-- Estado -->
            <td>
              <span th:if="${p.estProd == 1}" class="badge-estado badge-activo">Activo</span>
              <span th:if="${p.estProd != 1}" class="badge-estado badge-inactivo">Inactivo</span>
            </td>
			
			<td style="color:var(--warm); font-size:0.78rem;" th:text="${p.fechaRegistro}"></td>
			
			<td style="color:var(--warm); font-size:0.78rem;"  th:text="${#temporals.format(p.fechaActualizacion, 'dd/MM/yyyy HH:mm:ss')}"></td>


            <!-- Acciones -->
            <td>
              <div style="display:flex; gap:6px;">

                <!-- Editar -->
                <a th:href="@{'/Productos/editar/' + ${p.idProd}}"
                   class="btn-action" title="Editar">
                  <i class="fa-solid fa-pen-to-square"></i>
                </a>

                <!-- Desactivar si activo -->
                <a th:if="${p.estProd == 1}"
                   th:href="@{'/Productos/desactivar/' + ${p.idProd}}"
                   class="btn-action danger btnDesactivar"
                   title="Desactivar">
                  <i class="fa-solid fa-ban"></i>
                </a>

                <!-- Activar si inactivo -->
                <a th:if="${p.estProd != 1}"
                   th:href="@{'/Productos/activar/' + ${p.idProd}}"
                   class="btn-action success-btn btnActivar"
                   title="Activar">
                  <i class="fa-solid fa-check"></i>
                </a>

              </div>
            </td>

          </tr>
        </tbody>
      </table>
    </div>

    <!-- SIN DATOS -->
    <div th:if="${lstProductos == null or lstProductos.isEmpty()}" class="empty-state">
      <i class="fa-regular fa-shirt"></i>
      <p>Aún no hay productos registrados.<br>Comienza agregando tu primer producto.</p>
    </div>

  </div>
  <!-- /TABLE CARD -->

</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
<script>
  document.querySelectorAll('.btnDesactivar').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const url = this.href;
      Swal.fire({
        title: '¿Desactivar producto?',
        text: 'El producto ya no estará disponible.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#b5956a',
        cancelButtonColor: '#16140f',
        confirmButtonText: 'Sí, desactivar',
        cancelButtonText: 'Cancelar'
      }).then(result => { if (result.isConfirmed) window.location.href = url; });
    });
  });

  document.querySelectorAll('.btnActivar').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const url = this.href;
      Swal.fire({
        title: '¿Activar producto?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#2d6a4f',
        cancelButtonColor: '#16140f',
        confirmButtonText: 'Sí, activar',
        cancelButtonText: 'Cancelar'
      }).then(result => { if (result.isConfirmed) window.location.href = url; });
    });
  });
</script>

<!-- SweetAlert mensajes -->
<script th:if="${param.exito}">
  Swal.fire({ icon: 'success', title: '¡Producto guardado!', text: 'El producto se registró correctamente.', confirmButtonColor: '#b5956a' });
</script>
<script th:if="${param.activado}">
  Swal.fire({ icon: 'success', title: '¡Producto activado!', confirmButtonColor: '#2d6a4f' });
</script>
<script th:if="${param.desactivado}">
  Swal.fire({ icon: 'warning', title: 'Producto desactivado', confirmButtonColor: '#b5956a' });
</script>

</body>
</html>
