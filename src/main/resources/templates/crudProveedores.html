<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proveedores - MAISON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --dark:   #16140f;
      --cream:  #f5f0e8;
      --cream2: #ede6d8;
      --sand:   #c9b89a;
      --accent: #b5956a;
      --warm:   #8c7b6b;
      --error:  #c0392b;
    }
    html, body { margin: 0; padding: 0; background: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300; color: var(--dark); }

    .page-body { padding: 40px 32px; max-width: 1100px; margin: 0 auto; }

    /* HEADER */
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--cream2); }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 300; color: var(--dark); line-height: 1.1; }
    .page-title em { font-style: italic; color: var(--accent); }
    .page-sub { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--warm); margin-top: 4px; }

    /* BUTTONS */
    .btn-primary-custom { background: var(--dark); color: var(--cream); border: none; font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; text-decoration: none; transition: background 0.25s, letter-spacing 0.25s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer; }
    .btn-primary-custom:hover { background: var(--accent); color: var(--cream); letter-spacing: 0.45em; text-decoration: none; }
    .btn-back { background: transparent; color: var(--warm); border: 1px solid var(--cream2); font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-back:hover { border-color: var(--warm); color: var(--dark); text-decoration: none; }
    .btn-cancel-form { background: transparent; color: var(--warm); border: 1px solid var(--cream2); font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn-cancel-form:hover { border-color: var(--warm); color: var(--dark); }

    /* FORM CARD */
    .form-card { background: white; border-radius: 4px; border: 1px solid var(--cream2); overflow: hidden; margin-bottom: 28px; animation: fadeUp 0.4s ease both; }
    .form-card-header { padding: 16px 24px; border-bottom: 1px solid var(--cream2); display: flex; align-items: center; gap: 10px; }
    .form-card-header i { color: var(--accent); font-size: 0.8rem; }
    .form-card-header span { font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm); }
    .form-card-body { padding: 24px 28px; }

    .field { margin-bottom: 1.4rem; }
    .field label { display: block; font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm); margin-bottom: 0.5rem; }
    .field label .req { color: var(--accent); margin-left: 2px; }
    .field input[type="text"],
    .field input[type="email"],
    .field input[type="tel"] {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid #d9cfc4; padding: 0.6rem 0;
      font-family: 'Jost', sans-serif; font-size: 0.88rem; font-weight: 300;
      color: var(--dark); outline: none; transition: border-color 0.3s;
      letter-spacing: 0.04em;
    }
    .field input[type="text"]::placeholder,
    .field input[type="email"]::placeholder,
    .field input[type="tel"]::placeholder { color: #c5bab0; font-weight: 200; }
    .field input[type="text"]:focus,
    .field input[type="email"]:focus,
    .field input[type="tel"]:focus { border-bottom-color: var(--accent); }
    .field input.is-invalid { border-bottom-color: var(--error); }
    .field .error-msg { font-size: 0.65rem; color: var(--error); margin-top: 4px; }

    /* Indicador edición */
    .editing-banner {
      background: rgba(181,149,106,0.1);
      border: 1px solid rgba(181,149,106,0.3);
      border-left: 3px solid var(--accent);
      border-radius: 2px;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* TABLE CARD */
    .table-card { background: white; border-radius: 4px; border: 1px solid var(--cream2); overflow: hidden; animation: fadeUp 0.4s 0.1s ease both; }
    .table-card-header { padding: 16px 24px; border-bottom: 1px solid var(--cream2); display: flex; align-items: center; justify-content: space-between; }
    .table-card-header .t-title { font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm); display: flex; align-items: center; gap: 8px; }
    .table-card-header .t-title i { color: var(--accent); }

    .table-maison { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .table-maison thead tr { border-bottom: 1px solid var(--cream2); }
    .table-maison thead th { padding: 12px 20px; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm); font-weight: 400; background: #faf7f2; }
    .table-maison tbody tr { border-bottom: 1px solid #f2ede4; transition: background 0.15s; }
    .table-maison tbody tr:last-child { border-bottom: none; }
    .table-maison tbody tr:hover { background: #fdf9f4; }
    .table-maison tbody td { padding: 14px 20px; color: var(--dark); vertical-align: middle; font-weight: 300; }

    .badge-estado { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; letter-spacing: 0.06em; font-weight: 400; }
    .badge-activo   { background: #edf7f1; color: #2d6a4f; }
    .badge-inactivo { background: #fef0f0; color: #c0392b; }

    .btn-action { width: 30px; height: 30px; border-radius: 3px; border: 1px solid var(--cream2); background: white; color: var(--warm); font-size: 0.72rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); background: rgba(181,149,106,0.06); text-decoration: none; }
    .btn-action.danger:hover { border-color: #c0392b; color: #c0392b; background: rgba(192,57,43,0.05); }
    .btn-action.success-btn:hover { border-color: #2d6a4f; color: #2d6a4f; background: rgba(45,106,79,0.05); }

    /* Texto secundario en tabla (email, teléfono) */
    .td-meta { font-size: 0.75rem; color: var(--warm); }
    .td-meta i { margin-right: 5px; font-size: 0.68rem; opacity: 0.7; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 50px 20px; color: var(--warm); }
    .empty-state i { font-size: 1.8rem; opacity: 0.3; margin-bottom: 12px; display: block; color: var(--sand); }
    .empty-state p { font-size: 0.78rem; letter-spacing: 0.1em; opacity: 0.7; }

    /* Botones form footer */
    .form-actions { display: flex; gap: 10px; padding-top: 8px; justify-content: flex-end; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .page-body { padding: 24px 16px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .form-actions { justify-content: stretch; }
      .form-actions .btn-primary-custom { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="page-body">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <div class="page-title">Gestión de <em>Proveedores</em></div>
      <div class="page-sub">Catálogo &nbsp;·&nbsp; MAISON</div>
    </div>
    <a href="/dashboard" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Volver
    </a>
  </div>

  <!-- BANNER EDICIÓN -->
  <div th:if="${proveedor.idProveedor != 0}" class="editing-banner">
    <i class="fa-solid fa-pen-to-square"></i>
    Editando proveedor: <strong th:text="${proveedor.nombre}"></strong>
  </div>

  <!-- FORMULARIO -->
  <div class="form-card">
    <div class="form-card-header">
      <i class="fa-solid fa-truck"></i>
      <span th:if="${proveedor.idProveedor == 0}">Nuevo Proveedor</span>
      <span th:if="${proveedor.idProveedor != 0}">Editar Proveedor</span>
    </div>
    <div class="form-card-body">

      <form th:action="@{/Proveedores/grabar}"
            th:object="${proveedor}"
            method="post">

        <!-- ID oculto para edición -->
        <input type="hidden" th:field="*{idProveedor}">

        <div class="row">

          <!-- Nombre -->
          <div class="col-md-4">
            <div class="field">
              <label>Nombre <span class="req">*</span></label>
              <input type="text"
                     th:field="*{nombre}"
                     th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                     placeholder="Ej: Textiles Sur S.A.C.">
              <div class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
          </div>

          <!-- Teléfono -->
          <div class="col-md-3">
            <div class="field">
              <label>Teléfono</label>
              <input type="tel"
                     th:field="*{telefono}"
                     th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                     placeholder="Ej: 987654321">
              <div class="error-msg" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-5">
            <div class="field">
              <label>Email</label>
              <input type="email"
                     th:field="*{email}"
                     th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                     placeholder="Ej: contacto@proveedor.com">
              <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
          </div>

        </div>

        <!-- Acciones -->
        <div class="form-actions">
          <a th:if="${proveedor.idProveedor != 0}"
             href="/Proveedores/cargar"
             class="btn-cancel-form" title="Cancelar edición">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </a>
          <button type="submit" class="btn-primary-custom">
            <i th:if="${proveedor.idProveedor == 0}" class="fa-solid fa-floppy-disk"></i>
            <i th:if="${proveedor.idProveedor != 0}" class="fa-solid fa-rotate"></i>
            <span th:if="${proveedor.idProveedor == 0}">Guardar</span>
            <span th:if="${proveedor.idProveedor != 0}">Actualizar</span>
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- TABLA -->
  <div class="table-card">
    <div class="table-card-header">
      <div class="t-title">
        <i class="fa-solid fa-truck"></i> Proveedores Registrados
      </div>
      <span style="font-size:0.65rem; color:var(--warm); letter-spacing:0.1em;"
            th:text="${lstProveedores != null ? lstProveedores.size() + ' registros' : '0 registros'}"></span>
    </div>

    <!-- CON DATOS -->
    <div th:if="${lstProveedores}" class="table-responsive">
      <table class="table-maison">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${lstProveedores}">

            <!-- ID -->
            <td style="color:var(--warm); font-size:0.78rem;" th:text="${p.idProveedor}"></td>

            <!-- Nombre -->
            <td th:text="${p.nombre}"></td>

            <!-- Teléfono -->
            <td>
              <span class="td-meta" th:if="${p.telefono != null and !p.telefono.isEmpty()}">
                <i class="fa-solid fa-phone"></i>
                <span th:text="${p.telefono}"></span>
              </span>
              <span th:if="${p.telefono == null or p.telefono.isEmpty()}"
                    style="color:#ccc; font-size:0.75rem;">—</span>
            </td>

            <!-- Email -->
            <td>
              <span class="td-meta" th:if="${p.email != null and !p.email.isEmpty()}">
                <i class="fa-solid fa-envelope"></i>
                <span th:text="${p.email}"></span>
              </span>
              <span th:if="${p.email == null or p.email.isEmpty()}"
                    style="color:#ccc; font-size:0.75rem;">—</span>
            </td>

            <!-- Estado -->
            <td>
              <span th:if="${p.estProveedor == 1}" class="badge-estado badge-activo">Activo</span>
              <span th:if="${p.estProveedor != 1}" class="badge-estado badge-inactivo">Inactivo</span>
            </td>

            <!-- Acciones -->
            <td>
              <div style="display:flex; gap:6px;">

                <!-- Editar -->
                <a th:href="@{'/Proveedores/editar/' + ${p.idProveedor}}"
                   class="btn-action" title="Editar">
                  <i class="fa-solid fa-pen-to-square"></i>
                </a>

                <!-- Desactivar si activo -->
                <a th:if="${p.estProveedor == 1}"
                   th:href="@{'/Proveedores/desactivar/' + ${p.idProveedor}}"
                   class="btn-action danger btnDesactivar"
                   title="Desactivar">
                  <i class="fa-solid fa-ban"></i>
                </a>

                <!-- Activar si inactivo -->
                <a th:if="${p.estProveedor != 1}"
                   th:href="@{'/Proveedores/activar/' + ${p.idProveedor}}"
                   class="btn-action success-btn btnActivar"
                   title="Activar">
                  <i class="fa-solid fa-check"></i>
                </a>

              </div>
            </td>

          </tr>
        </tbody>
      </table>
    </div>

    <!-- SIN DATOS -->
    <div th:if="${lstProveedores == null or lstProveedores.isEmpty()}" class="empty-state">
      <i class="fa-regular fa-building"></i>
      <p>Aún no hay proveedores registrados.</p>
    </div>

  </div>
  <!-- /TABLA -->

</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
<script>
  document.querySelectorAll('.btnDesactivar').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const url = this.href;
      Swal.fire({
        title: '¿Desactivar proveedor?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#b5956a',
        cancelButtonColor: '#16140f',
        confirmButtonText: 'Sí, desactivar',
        cancelButtonText: 'Cancelar'
      }).then(result => { if (result.isConfirmed) window.location.href = url; });
    });
  });

  document.querySelectorAll('.btnActivar').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const url = this.href;
      Swal.fire({
        title: '¿Activar proveedor?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#2d6a4f',
        cancelButtonColor: '#16140f',
        confirmButtonText: 'Sí, activar',
        cancelButtonText: 'Cancelar'
      }).then(result => { if (result.isConfirmed) window.location.href = url; });
    });
  });
</script>

<!-- SweetAlert mensajes -->
<script th:if="${param.exito}">
  Swal.fire({ icon: 'success', title: '¡Proveedor guardado!', confirmButtonColor: '#b5956a' });
</script>
<script th:if="${param.activado}">
  Swal.fire({ icon: 'success', title: '¡Proveedor activado!', confirmButtonColor: '#2d6a4f' });
</script>
<script th:if="${param.desactivado}">
  Swal.fire({ icon: 'warning', title: 'Proveedor desactivado', confirmButtonColor: '#b5956a' });
</script>

</body>
</html>
